# ImobOS runtime. Docker Compose owns the services; Nix owns the toolchain (docs/adr/0003).
#
# ONLY caddy publishes ports. Docker writes its own iptables rules and bypasses ufw, so a
# `ports:` entry anywhere else would expose that service to the internet.
#
# Networks (docs/adr/0005, 0009): each service sees only what it talks to.
#   internet -> caddy -[edge]-> web -[app]-> api -[data]-> postgres, redis
#   internet -> caddy -[chat]-> chatwoot -[chat-data]-> chatwoot-postgres, chatwoot-redis
name: imobos

# Chatwoot (ADR 0009): one image runs both the Rails app and the Sidekiq worker, with the same
# settings. Pinned like everything else; an upgrade is a reviewed edit, migrations run by hand.
x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.18.0
  restart: unless-stopped
  environment:
    TZ: ${TZ:-America/Sao_Paulo}
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    FRONTEND_URL: https://${CHATWOOT_DOMAIN:?set CHATWOOT_DOMAIN in .env}
    DEFAULT_LOCALE: pt_BR
    # Caddy terminates TLS and sends X-Forwarded-Proto; Rails then marks cookies Secure.
    FORCE_SSL: "true"
    # Accounts exist only because the operator created them (docs/operations/chatwoot.md).
    ENABLE_ACCOUNT_SIGNUP: "false"
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?set CHATWOOT_SECRET_KEY_BASE in .env}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${CHATWOOT_AR_ENCRYPTION_PRIMARY_KEY:?set it in .env}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${CHATWOOT_AR_ENCRYPTION_DETERMINISTIC_KEY:?set it in .env}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${CHATWOOT_AR_ENCRYPTION_KEY_DERIVATION_SALT:?set it in .env}
    POSTGRES_HOST: chatwoot-postgres
    POSTGRES_USERNAME: chatwoot
    POSTGRES_DATABASE: chatwoot
    POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?set CHATWOOT_POSTGRES_PASSWORD in .env}
    REDIS_URL: redis://chatwoot-redis:6379
    REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?set CHATWOOT_REDIS_PASSWORD in .env}
    RAILS_MAX_THREADS: "5"
    ACTIVE_STORAGE_SERVICE: local # attachments in the chatwoot_storage volume, backed up
    VIPS_BLOCK_UNTRUSTED: "1"
    RAILS_LOG_TO_STDOUT: "true"
    LOG_LEVEL: info
    # Nothing about this installation or its people leaves for third parties: no usage telemetry,
    # no Gravatar lookups by e-mail hash, and no push relay through chatwoot.com (it would carry
    # message previews) until that is decided.
    DISABLE_TELEMETRY: "true"
    DISABLE_GRAVATAR: "true"
    ENABLE_PUSH_RELAY_SERVER: "false"
    # "Sign in with Google" for existing agents only (signup is closed). Empty leaves it off.
    GOOGLE_OAUTH_CLIENT_ID: ${CHATWOOT_GOOGLE_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${CHATWOOT_GOOGLE_CLIENT_SECRET:-}
    GOOGLE_OAUTH_CALLBACK_URL: https://${CHATWOOT_DOMAIN:?set CHATWOOT_DOMAIN in .env}/omniauth/google_oauth2/callback
  volumes:
    - chatwoot_storage:/app/storage
  depends_on:
    chatwoot-postgres:
      condition: service_healthy
    chatwoot-redis:
      condition: service_healthy
  # chat has a route out: WhatsApp (Meta Graph API) and Google are called from here.
  networks: [chat, chat-data]

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      IMOBOS_DOMAIN: ${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      # The directory, not the file: git replaces Caddyfile with a new inode on pull, and a single-
      # file bind mount would keep showing the old one, so `caddy reload` would reload nothing.
      - ./infrastructure/caddy:/etc/caddy:ro
      - caddy_data:/data # certificates and ACME account: losing it means re-issuing
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SITE_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
    image: imobos/web:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Authentication (ADR 0006). AUTH_URL is the public origin; the Google callback is
      # ${AUTH_URL}/api/auth/callback/google and must match the OAuth client exactly.
      AUTH_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      # Also a build arg: static pages resolve metadata at build, dynamic ones at request time.
      SITE_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env}
      # Who may sign in is decided by the api's user table (ADR 0007), over the app network.
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # Connected accounts (ADR 0008): the web only needs the public client id to start consent.
      GOOGLE_INTEGRATIONS_CLIENT_ID: ${GOOGLE_INTEGRATIONS_CLIENT_ID:-}
    networks: [edge, app]

  api:
    build:
      context: apps/api
    image: imobos/api:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imobos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-imobos}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      # Users and approval (ADR 0007). The token authenticates the web app on /internal/*.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      IMOBOS_ADMIN_EMAILS: ${IMOBOS_ADMIN_EMAILS:?set IMOBOS_ADMIN_EMAILS in .env}
      IMOBOS_SIGNUP_OPEN: ${IMOBOS_SIGNUP_OPEN:-true}
      IMOBOS_MAX_PENDING: ${IMOBOS_MAX_PENDING:-10}
      # Connected accounts (ADR 0008). Empty values leave integrations unavailable, never insecure.
      IMOBOS_PUBLIC_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      IMOBOS_TOKEN_KEYS: ${IMOBOS_TOKEN_KEYS:-}
      GOOGLE_INTEGRATIONS_CLIENT_ID: ${GOOGLE_INTEGRATIONS_CLIENT_ID:-}
      GOOGLE_INTEGRATIONS_CLIENT_SECRET: ${GOOGLE_INTEGRATIONS_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]

  postgres:
    image: postgres:17.11 # same major as the flake's psql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: ${POSTGRES_USER:-imobos}
      POSTGRES_DB: ${POSTGRES_DB:-imobos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  redis:
    image: redis:8.8.3-alpine # same version as the flake's redis-cli
    restart: unless-stopped
    # The password travels through the environment, never on the command line `ps` shows.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  chatwoot:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    healthcheck:
      # /api answers with the version and checks Postgres and Redis. The header stands in for
      # Caddy, so FORCE_SSL does not redirect the probe.
      test: ["CMD-SHELL", "wget -qO- --header 'X-Forwarded-Proto: https' http://127.0.0.1:3000/api | grep -q '\"data_services\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  chatwoot-worker:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # Its own database and cache: Chatwoot needs pgvector, upgrades on its own schedule, and a
  # problem there never reaches the ImobOS data (ADR 0009).
  chatwoot-postgres:
    image: pgvector/pgvector:0.8.7-pg17 # PostgreSQL 17, the flake's psql major
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: chatwoot
      POSTGRES_DB: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?set CHATWOOT_POSTGRES_PASSWORD in .env}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [chat-data]

  chatwoot-redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD:?set CHATWOOT_REDIS_PASSWORD in .env}
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [chat-data]

networks:
  edge: {}
  app: {}
  # No route to the internet: the databases have no reason to reach out.
  data:
    internal: true
  chat: {}
  chat-data:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}
  chatwoot_storage: {} # attachments: photos, plans and documents sent in conversations
  chatwoot_postgres_data: {}
  chatwoot_redis_data: {}

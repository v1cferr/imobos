# ImobOS runtime. Docker Compose owns the services; Nix owns the toolchain (docs/adr/0003).
#
# ONLY caddy publishes ports. Docker writes its own iptables rules and bypasses ufw, so a
# `ports:` entry anywhere else would expose that service to the internet.
#
# Networks (docs/adr/0005): each service sees only what it talks to.
#   internet -> caddy -[edge]-> web -[app]-> api -[data]-> postgres, redis
name: imobos

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      IMOBOS_DOMAIN: ${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      # The directory, not the file: git replaces Caddyfile with a new inode on pull, and a single-
      # file bind mount would keep showing the old one, so `caddy reload` would reload nothing.
      - ./infrastructure/caddy:/etc/caddy:ro
      - caddy_data:/data # certificates and ACME account: losing it means re-issuing
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SITE_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
    image: imobos/web:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Authentication (ADR 0006). AUTH_URL is the public origin; the Google callback is
      # ${AUTH_URL}/api/auth/callback/google and must match the OAuth client exactly.
      AUTH_URL: https://${IMOBOS_DOMAIN:?set IMOBOS_DOMAIN in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env}
      # Who may sign in is decided by the api's user table (ADR 0007), over the app network.
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    networks: [edge, app]

  api:
    build:
      context: apps/api
    image: imobos/api:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imobos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-imobos}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      # Users and approval (ADR 0007). The token authenticates the web app on /internal/*.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      IMOBOS_ADMIN_EMAILS: ${IMOBOS_ADMIN_EMAILS:?set IMOBOS_ADMIN_EMAILS in .env}
      IMOBOS_SIGNUP_OPEN: ${IMOBOS_SIGNUP_OPEN:-true}
      IMOBOS_MAX_PENDING: ${IMOBOS_MAX_PENDING:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]

  postgres:
    image: postgres:17.11 # same major as the flake's psql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      POSTGRES_USER: ${POSTGRES_USER:-imobos}
      POSTGRES_DB: ${POSTGRES_DB:-imobos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  redis:
    image: redis:8.8.3-alpine # same version as the flake's redis-cli
    restart: unless-stopped
    # The password travels through the environment, never on the command line `ps` shows.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

networks:
  edge: {}
  app: {}
  # No route to the internet: the databases have no reason to reach out.
  data:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}

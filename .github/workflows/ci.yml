# Proves the bootstrap on a clean machine: the same flake, the same commands as the README.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Flake check
        run: nix flake check

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Typecheck
        run: nix develop --command pnpm typecheck

      - name: Test
        run: nix develop --command pnpm test

      - name: Build
        run: nix develop --command pnpm build

      # Throwaway values: compose refuses to run with the required secrets unset.
      - name: Compose env
        run: |
          sed -e 's/^IMOBOS_DOMAIN=$/IMOBOS_DOMAIN=ci.invalid/' \
              -e 's/^ACME_EMAIL=$/ACME_EMAIL=ci@ci.invalid/' \
              -e 's/^BASIC_AUTH_USER=$/BASIC_AUTH_USER=ci/' \
              -e "s/^BASIC_AUTH_HASH=''$/BASIC_AUTH_HASH='ci-not-a-hash'/" \
              -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
              -e 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' \
              -e 's/^AUTH_SECRET=$/AUTH_SECRET=ci/' \
              -e 's/^AUTH_GOOGLE_ID=$/AUTH_GOOGLE_ID=ci/' \
              -e 's/^AUTH_GOOGLE_SECRET=$/AUTH_GOOGLE_SECRET=ci/' \
              -e 's/^IMOBOS_ADMIN_EMAILS=$/IMOBOS_ADMIN_EMAILS=ci@ci.invalid/' \
              .env.example > .env

      - name: Compose config
        run: docker compose config --quiet

      - name: Compose build
        run: docker compose build
